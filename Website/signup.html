<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Join Nova
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<div id="header"></div>


<div id="site">

    <main
        style="
            max-width:700px;
            margin:30px auto;
            padding:20px;
        "
    >

        <section class="retro-box">

            <div class="retro-box-title">
                ☕ Join Nova
            </div>


            <div class="retro-box-content">

                <h1>
                    Create your account
                </h1>


                <p>
                    Pick a username and start
                    exploring Nova.
                </p>


                <form id="signupForm">


                    <div class="form-row">

                        <label
                            for="username"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            maxlength="20"
                            required
                        >

                    </div>



                    <div class="form-row">

                        <label
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                        >

                    </div>



                    <div class="form-row">

                        <label
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            required
                        >

                    </div>



                    <div class="form-row">

                        <label
                            for="confirmPassword"
                        >
                            Confirm Password
                        </label>

                        <input
                            id="confirmPassword"
                            type="password"
                            required
                        >

                    </div>



                    <button
                        class="retro-button"
                        type="submit"
                    >
                        Join Nova ☕
                    </button>


                    <p
                        id="signupMessage"
                        style="
                            margin-top:15px;
                            font-weight:bold;
                        "
                    ></p>


                </form>


                <hr
                    style="
                        margin:25px 0;
                        border:none;
                        border-top:1px dashed #b99773;
                    "
                >


                <p>
                    Already have an account?
                    <a href="login.html">
                        Login here.
                    </a>
                </p>


            </div>

        </section>

    </main>


    <footer class="footer">

        ☕ Nova

    </footer>

</div>


<script src="js/nova-storage.js"></script>
<script src="js/nova-auth.js"></script>
<script src="shell.js"></script>


<script>

renderShell();


if (
    NovaAuth.isLoggedIn()
) {

    window.location.href =
        "index.html";

}


const form =
    document.getElementById(
        "signupForm"
    );


form.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const username =
            document
                .getElementById(
                    "username"
                )
                .value;


        const email =
            document
                .getElementById(
                    "email"
                )
                .value;


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        const message =
            document
                .getElementById(
                    "signupMessage"
                );


        if (
            password !==
            confirmPassword
        ) {

            message.style.color =
                "#a52a2a";

            message.textContent =
                "Passwords do not match.";

            return;

        }


        const result =
            NovaAuth.createAccount(
                username,
                password,
                email
            );


        if (!result.success) {

            message.style.color =
                "#a52a2a";

            message.textContent =
                result.message;

            return;

        }


        message.style.color =
            "#547044";

        message.textContent =
            "Account created!";


        setTimeout(
            () => {

                window.location.href =
                    "index.html";

            },
            500
        );

    }
);

</script>


</body>
</html>
