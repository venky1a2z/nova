<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Nova
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<div id="header"></div>


<div id="site">

    <main
        style="
            max-width:620px;
            margin:30px auto;
            padding:20px;
        "
    >

        <section class="retro-box">

            <div class="retro-box-title">
                ☕ Welcome Back
            </div>


            <div class="retro-box-content">

                <h1>
                    Login to Nova
                </h1>


                <form id="loginForm">


                    <div class="form-row">

                        <label
                            for="username"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            required
                        >

                    </div>



                    <div class="form-row">

                        <label
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            required
                        >

                    </div>



                    <button
                        class="retro-button"
                        type="submit"
                    >
                        Login ☕
                    </button>


                    <p
                        id="loginMessage"
                        style="
                            margin-top:15px;
                            font-weight:bold;
                        "
                    ></p>


                </form>


                <hr
                    style="
                        margin:25px 0;
                        border:none;
                        border-top:1px dashed #b99773;
                    "
                >


                <p>
                    New here?

                    <a href="signup.html">
                        Create an account.
                    </a>
                </p>


            </div>

        </section>

    </main>


    <footer class="footer">
        ☕ Nova
    </footer>

</div>


<script src="js/nova-storage.js"></script>
<script src="js/nova-auth.js"></script>
<script src="shell.js"></script>


<script>

renderShell();


if (
    NovaAuth.isLoggedIn()
) {

    window.location.href =
        "index.html";

}


document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value;


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const message =
                document
                    .getElementById(
                        "loginMessage"
                    );


            const result =
                NovaAuth.login(
                    username,
                    password
                );


            if (!result.success) {

                message.style.color =
                    "#a52a2a";

                message.textContent =
                    result.message;

                return;

            }


            message.style.color =
                "#547044";

            message.textContent =
                "Welcome back!";


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                400
            );

        }
    );

</script>


</body>
</html>
