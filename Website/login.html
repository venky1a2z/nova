<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Nova</title>


    <style>

        * {
            box-sizing:
                border-box;
        }


        html,
        body {

            width:
                100%;

            min-height:
                100%;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            color:
                #fffaf0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    rgba(
                        40,
                        25,
                        15,
                        0.16
                    ),
                    rgba(
                        40,
                        25,
                        15,
                        0.20
                    )
                ),
                url(
                    "assets/backgrounds/nova-login-bg.png"
                )
                center center
                /
                cover
                no-repeat
                fixed;

        }


        .landing-topbar {

            min-height:
                64px;

            padding:
                0 6%;

            display:
                flex;

            align-items:
                center;

            gap:
                32px;

            background:
                rgba(
                    53,
                    38,
                    28,
                    0.94
                );

            border-bottom:
                2px solid
                rgba(
                    255,
                    240,
                    210,
                    0.35
                );

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );

        }


        .landing-logo {

            color:
                #fff1cf;

            font-size:
                27px;

            font-weight:
                900;

            letter-spacing:
                1px;

            text-decoration:
                none;

        }


        .landing-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                28px;

            flex:
                1;

        }


        .landing-nav a {

            padding:
                21px 0 17px;

            color:
                #fff8e8;

            font-size:
                15px;

            text-decoration:
                none;

            border-bottom:
                3px solid
                transparent;

        }


        .landing-nav a:hover {

            border-bottom-color:
                #f0ca7d;

        }


        .landing-page {

            min-height:
                calc(
                    100vh - 64px
                );

            padding:
                55px 7%;

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                minmax(
                    370px,
                    430px
                );

            gap:
                75px;

            align-items:
                start;

        }


        .brand-area {

            max-width:
                650px;

            margin-top:
                110px;

        }


        .brand-logo-panel {

            display:
                inline-block;

            padding:
                17px 27px;

            background:
                rgba(
                    45,
                    30,
                    21,
                    0.82
                );

            border:
                2px solid
                rgba(
                    255,
                    244,
                    220,
                    0.35
                );

            border-radius:
                9px;

        }


        .brand-logo-panel img {

            width:
                min(
                    390px,
                    70vw
                );

            display:
                block;

        }


        .brand-tagline {

            margin:
                0;

            padding:
                11px 18px;

            display:
                inline-block;

            color:
                white;

            font-size:
                28px;

            background:
                rgba(
                    37,
                    30,
                    24,
                    0.78
                );

        }


        .login-card {

            margin-top:
                35px;

            padding:
                22px;

            color:
                #4f3828;

            background:
                rgba(
                    255,
                    250,
                    238,
                    0.95
                );

            border:
                1px solid
                rgba(
                    120,
                    83,
                    53,
                    0.45
                );

            box-shadow:
                0 5px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );

        }


        .login-card h1 {

            margin:
                0 0 8px;

            color:
                #4a3324;

            font-size:
                26px;

            font-weight:
                400;

        }


        .login-card p {

            color:
                #765842;

            font-size:
                13px;

        }


        .login-card input {

            width:
                100%;

            height:
                47px;

            margin-bottom:
                11px;

            padding:
                0 14px;

            color:
                #4b3828;

            font-size:
                14px;

            background:
                white;

            border:
                1px solid
                #c9b89f;

            border-radius:
                4px;

            outline:
                none;

        }


        .login-card input:focus {

            border-color:
                #9a714c;

        }


        .login-button {

            width:
                100%;

            height:
                43px;

            color:
                white;

            font-size:
                17px;

            font-weight:
                bold;

            background:
                #66864d;

            border:
                1px solid
                #405d33;

            border-radius:
                4px;

            cursor:
                pointer;

        }


        .login-button:hover {

            background:
                #73945a;

        }


        .login-button:disabled {

            opacity:
                0.65;

            cursor:
                wait;

        }


        .login-message {

            min-height:
                22px;

            margin-top:
                12px;

            font-size:
                13px;

            font-weight:
                bold;

        }


        .signup-link {

            margin-top:
                17px;

            text-align:
                center;

        }


        .signup-link a {

            color:
                #7c4d2d;

            font-weight:
                bold;

        }


        @media
        (
            max-width:
                900px
        ) {

            .landing-page {

                grid-template-columns:
                    1fr;

            }


            .brand-area {

                margin-top:
                    20px;

                text-align:
                    center;

            }


            .login-card {

                width:
                    min(
                        430px,
                        100%
                    );

                margin:
                    auto;

            }

        }

    </style>

</head>


<body>


    <header class="landing-topbar">

        <a
            class="landing-logo"
            href="index.html"
        >
            NOVA
        </a>


        <nav class="landing-nav">

            <a href="games.html">
                Play
            </a>

            <a href="index.html">
                About
            </a>

            <a href="install.html">
                Platforms
            </a>

        </nav>

    </header>


    <main class="landing-page">


        <section class="brand-area">

            <div class="brand-logo-panel">

                <img
                    src="assets/logo/nova-logo.png"
                    alt="Nova"
                >

            </div>


            <div>

                <p class="brand-tagline">
                    The World Powered by Players.
                </p>

            </div>

        </section>



        <section class="login-card">

            <h1>
                Welcome back!
            </h1>


            <p>
                Log in to continue to Nova.
            </p>


            <form id="loginForm">

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >


                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    class="login-button"
                    id="loginButton"
                    type="submit"
                >
                    Log In
                </button>


                <p
                    class="login-message"
                    id="loginMessage"
                ></p>

            </form>


            <p class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </section>


    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/nova-storage.js"></script>

    <script src="js/nova-supabase.js"></script>

    <script src="js/nova-auth.js"></script>


    <script>

        NovaAuth
            .refreshSession()
            .then(
                user => {

                    if (
                        user
                    ) {

                        window.location.href =
                            "index.html";

                    }

                }
            );


        document
            .getElementById(
                "loginForm"
            )
            .addEventListener(
                "submit",
                async event => {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value;


                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;


                    const message =
                        document
                            .getElementById(
                                "loginMessage"
                            );


                    const button =
                        document
                            .getElementById(
                                "loginButton"
                            );


                    message.textContent =
                        "";


                    button.disabled =
                        true;


                    button.textContent =
                        "Logging In...";


                    const result =
                        await NovaAuth
                            .login(
                                email,
                                password
                            );


                    button.disabled =
                        false;


                    button.textContent =
                        "Log In";


                    if (
                        !result.success
                    ) {

                        message.style.color =
                            "#a52a2a";


                        message.textContent =
                            result.message;

                        return;

                    }


                    message.style.color =
                        "#547044";


                    message.textContent =
                        "Welcome back!";


                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        400
                    );

                }
            );

    </script>


</body>

</html>
