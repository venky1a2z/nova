<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Nova
    </title>


    <style>

        * {

            box-sizing:
                border-box;

        }


        html,
        body {

            width:
                100%;

            min-height:
                100%;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            color:
                #fffaf0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #65c7df;

            overflow-x:
                hidden;

        }


        /* =====================================================
           ROTATING BACKGROUND
        ====================================================== */

        .nova-background {

            position:
                fixed;

            inset:
                0;

            z-index:
                -10;

            overflow:
                hidden;

            background:
                #65c7df;

        }


        .nova-background-layer {

            position:
                absolute;

            inset:
                0;

            opacity:
                0;

            background-position:
                center center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            transition:
                opacity
                1.2s
                ease;

        }


        .nova-background-layer.active {

            opacity:
                1;

        }


        .nova-background-overlay {

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    rgba(
                        40,
                        25,
                        15,
                        0.16
                    ),
                    rgba(
                        40,
                        25,
                        15,
                        0.20
                    )
                );

        }


        /* =====================================================
           OG TOP BAR
        ====================================================== */

        .landing-topbar {

            min-height:
                64px;

            padding:
                0 6%;

            display:
                flex;

            align-items:
                center;

            gap:
                32px;

            background:
                rgba(
                    53,
                    38,
                    28,
                    0.94
                );

            border-bottom:
                2px solid
                rgba(
                    255,
                    240,
                    210,
                    0.35
                );

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );

        }


        .landing-logo {

            color:
                #fff1cf;

            font-size:
                27px;

            font-weight:
                900;

            letter-spacing:
                1px;

            text-decoration:
                none;

        }


        .landing-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                28px;

            flex:
                1;

        }


        .landing-nav a {

            padding:
                21px 0 17px;

            color:
                #fff8e8;

            font-size:
                15px;

            text-decoration:
                none;

            border-bottom:
                3px solid
                transparent;

        }


        .landing-nav a:hover {

            border-bottom-color:
                #f0ca7d;

        }


        /* =====================================================
           PAGE
        ====================================================== */

        .landing-page {

            min-height:
                calc(
                    100vh - 64px
                );

            padding:
                55px 7%;

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                minmax(
                    370px,
                    430px
                );

            gap:
                75px;

            align-items:
                start;

        }


        /* =====================================================
           BRAND AREA
        ====================================================== */

        .brand-area {

            max-width:
                650px;

            margin-top:
                110px;

        }


        .brand-logo-panel {

            display:
                inline-block;

            padding:
                17px 27px;

            background:
                rgba(
                    45,
                    30,
                    21,
                    0.82
                );

            border:
                2px solid
                rgba(
                    255,
                    244,
                    220,
                    0.35
                );

            border-radius:
                9px;

            box-shadow:
                0 3px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        .brand-logo-panel img {

            width:
                min(
                    390px,
                    70vw
                );

            display:
                block;

        }


        .brand-tagline {

            margin:
                0;

            padding:
                11px 18px;

            display:
                inline-block;

            color:
                white;

            font-size:
                28px;

            background:
                rgba(
                    37,
                    30,
                    24,
                    0.78
                );

        }


        /* =====================================================
           LOGIN CARD
        ====================================================== */

        .login-card {

            margin-top:
                35px;

            padding:
                22px;

            color:
                #4f3828;

            background:
                rgba(
                    255,
                    250,
                    238,
                    0.95
                );

            border:
                1px solid
                rgba(
                    120,
                    83,
                    53,
                    0.45
                );

            box-shadow:
                0 5px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );

        }


        .login-card h1 {

            margin:
                0 0 8px;

            color:
                #4a3324;

            font-size:
                26px;

            font-weight:
                400;

        }


        .login-card p {

            color:
                #765842;

            font-size:
                13px;

        }


        .login-card input {

            width:
                100%;

            height:
                47px;

            margin-bottom:
                11px;

            padding:
                0 14px;

            color:
                #4b3828;

            font-size:
                14px;

            background:
                white;

            border:
                1px solid
                #c9b89f;

            border-radius:
                4px;

            outline:
                none;

        }


        .login-card input:focus {

            border-color:
                #9a714c;

        }


        .login-button {

            width:
                100%;

            height:
                43px;

            color:
                white;

            font-size:
                17px;

            font-weight:
                bold;

            background:
                #66864d;

            border:
                1px solid
                #405d33;

            border-radius:
                4px;

            cursor:
                pointer;

        }


        .login-button:hover {

            background:
                #73945a;

        }


        .login-button:disabled {

            opacity:
                0.65;

            cursor:
                wait;

        }


        .login-message {

            min-height:
                22px;

            margin-top:
                12px;

            font-size:
                13px;

            font-weight:
                bold;

        }


        /* =====================================================
           GUEST
        ====================================================== */

        .guest-divider {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin:
                16px 0;

            color:
                #92755e;

            font-size:
                11px;

        }


        .guest-divider::before,
        .guest-divider::after {

            content:
                "";

            flex:
                1;

            height:
                1px;

            background:
                #d7c5a9;

        }


        .guest-button {

            width:
                100%;

            height:
                39px;

            color:
                #513c2d;

            font-size:
                14px;

            font-weight:
                bold;

            background:
                #f7f0e5;

            border:
                1px solid
                #b9a68c;

            border-radius:
                4px;

            cursor:
                pointer;

        }


        .guest-button:hover {

            background:
                #fffaf0;

        }


        .guest-note {

            margin:
                7px 0 0;

            color:
                #8e7662;

            font-size:
                10px;

            text-align:
                center;

        }


        /* =====================================================
           SIGNUP LINK
        ====================================================== */

        .signup-link {

            margin-top:
                20px;

            padding-top:
                17px;

            text-align:
                center;

            border-top:
                1px solid
                rgba(
                    120,
                    83,
                    53,
                    0.20
                );

        }


        .signup-link a {

            color:
                #7c4d2d;

            font-weight:
                bold;

        }


        /* =====================================================
           BACKGROUND DOTS
        ====================================================== */

        .background-dots {

            position:
                fixed;

            left:
                50%;

            bottom:
                18px;

            transform:
                translateX(
                    -50%
                );

            display:
                flex;

            gap:
                7px;

            z-index:
                20;

        }


        .background-dot {

            width:
                8px;

            height:
                8px;

            padding:
                0;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            border-radius:
                50%;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            cursor:
                pointer;

        }


        .background-dot.active {

            background:
                #fff1cf;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media
        (
            max-width:
                900px
        ) {

            .landing-page {

                grid-template-columns:
                    1fr;

            }


            .brand-area {

                margin-top:
                    20px;

                text-align:
                    center;

            }


            .login-card {

                width:
                    min(
                        430px,
                        100%
                    );

                margin:
                    auto;

            }

        }


        @media
        (
            max-width:
                600px
        ) {

            .landing-topbar {

                padding:
                    0 20px;

            }


            .landing-nav {

                gap:
                    15px;

            }


            .landing-nav a {

                font-size:
                    13px;

            }


            .landing-page {

                padding:
                    30px 20px;

            }


            .brand-tagline {

                font-size:
                    20px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
====================================================== -->

<div class="nova-background">

    <div
        id="backgroundLayerA"
        class="nova-background-layer active"
    ></div>

    <div
        id="backgroundLayerB"
        class="nova-background-layer"
    ></div>

    <div class="nova-background-overlay"></div>

</div>



<!-- =====================================================
     TOP BAR
====================================================== -->

<header class="landing-topbar">

    <a
        class="landing-logo"
        href="index.html"
    >
        NOVA
    </a>


    <nav class="landing-nav">

        <a href="games.html">
            Play
        </a>

        <a href="about.html">
            About
        </a>

        <a href="install.html">
            Platforms
        </a>

    </nav>

</header>



<!-- =====================================================
     PAGE
====================================================== -->

<main class="landing-page">


    <!-- =================================================
         EXISTING REAL NOVA LOGO
    ================================================== -->

    <section class="brand-area">

        <div class="brand-logo-panel">

            <img
                src="assets/logo/nova-logo.png"
                alt="Nova"
            >

        </div>


        <div>

            <p class="brand-tagline">
                The World Powered by Players.
            </p>

        </div>

    </section>



    <!-- =================================================
         LOGIN
    ================================================== -->

    <section class="login-card">

        <h1>
            Welcome back!
        </h1>


        <p>
            Log in to continue to Nova.
        </p>


        <form id="loginForm">

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="username"
                maxlength="20"
                required
            >


            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                class="login-button"
                id="loginButton"
                type="submit"
            >
                Log In
            </button>


            <p
                class="login-message"
                id="loginMessage"
            ></p>

        </form>



        <!-- GUEST -->

        <div class="guest-divider">
            OR
        </div>


        <button
            id="guestButton"
            class="guest-button"
            type="button"
        >
            Continue as Guest
        </button>


        <p class="guest-note">
            Guest data stays on this computer.
        </p>



        <!-- SIGNUP -->

        <p class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Sign up
            </a>

        </p>

    </section>


</main>



<!-- =====================================================
     SLIDESHOW DOTS
====================================================== -->

<div class="background-dots">

    <button
        class="background-dot"
        data-background="0"
        title="Background 1"
    ></button>

    <button
        class="background-dot"
        data-background="1"
        title="Background 2"
    ></button>

    <button
        class="background-dot"
        data-background="2"
        title="Background 3"
    ></button>

    <button
        class="background-dot"
        data-background="3"
        title="Background 4"
    ></button>

</div>



<!-- =====================================================
     SCRIPTS
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/nova-storage.js"></script>

<script src="js/nova-supabase.js"></script>

<script src="js/nova-auth.js"></script>


<script>


/* =========================================================
   BACKGROUND SLIDESHOW
========================================================= */

const loginBackgrounds = [

    "assets/backgrounds/login1.png",

    "assets/backgrounds/login2.png",

    "assets/backgrounds/login3.png",

    "assets/backgrounds/login4.png"

];


const backgroundLayerA =
    document.getElementById(
        "backgroundLayerA"
    );


const backgroundLayerB =
    document.getElementById(
        "backgroundLayerB"
    );


const backgroundDots =
    document.querySelectorAll(
        ".background-dot"
    );


let activeLayer =
    backgroundLayerA;


let inactiveLayer =
    backgroundLayerB;


let currentBackground =
    Math.floor(
        Math.random()
        *
        loginBackgrounds.length
    );


let slideshowTimer =
    null;


/*
    Preload all four images.
*/

loginBackgrounds.forEach(
    path => {

        const image =
            new Image();


        image.src =
            path;

    }
);


function updateDots() {


    backgroundDots.forEach(
        (
            dot,
            index
        ) => {


            dot.classList.toggle(
                "active",
                index ===
                    currentBackground
            );

        }
    );

}


function showBackground(
    index,
    immediate =
        false
) {


    currentBackground =
        index;


    if (
        immediate
    ) {


        activeLayer.style.backgroundImage =
            `url("${loginBackgrounds[currentBackground]}")`;


        activeLayer.classList.add(
            "active"
        );


        inactiveLayer.classList.remove(
            "active"
        );


        updateDots();


        return;

    }


    inactiveLayer.style.backgroundImage =
        `url("${loginBackgrounds[currentBackground]}")`;


    inactiveLayer.classList.add(
        "active"
    );


    activeLayer.classList.remove(
        "active"
    );


    const oldActive =
        activeLayer;


    activeLayer =
        inactiveLayer;


    inactiveLayer =
        oldActive;


    updateDots();

}


function nextBackground() {


    const next =
        (
            currentBackground + 1
        )
        %
        loginBackgrounds.length;


    showBackground(
        next
    );

}


function restartSlideshow() {


    if (
        slideshowTimer
    ) {


        clearInterval(
            slideshowTimer
        );

    }


    slideshowTimer =
        setInterval(
            nextBackground,
            7000
        );

}


showBackground(
    currentBackground,
    true
);


restartSlideshow();



/* =========================================================
   MANUAL DOT SELECTION
========================================================= */

backgroundDots.forEach(
    dot => {


        dot.addEventListener(
            "click",
            () => {


                const index =
                    Number(
                        dot.dataset.background
                    );


                if (
                    !Number.isFinite(
                        index
                    )
                ) {

                    return;

                }


                showBackground(
                    index
                );


                restartSlideshow();

            }
        );

    }
);



/* =========================================================
   EXISTING LOGIN CHECK
========================================================= */

NovaAuth
    .refreshSession()
    .then(
        user => {


            if (
                user
                &&
                !user.guest
            ) {


                window.location.href =
                    "index.html";

            }

        }
    )
    .catch(
        error => {

            console.warn(
                "Nova auth check:",
                error
            );

        }
    );



/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        async event => {


            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value;


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const message =
                document
                    .getElementById(
                        "loginMessage"
                    );


            const button =
                document
                    .getElementById(
                        "loginButton"
                    );


            message.textContent =
                "";


            button.disabled =
                true;


            button.textContent =
                "Logging In...";


            const result =
                await NovaAuth
                    .login(
                        username,
                        password
                    );


            button.disabled =
                false;


            button.textContent =
                "Log In";


            if (
                !result.success
            ) {


                message.style.color =
                    "#a52a2a";


                message.textContent =
                    result.message;


                return;

            }


            message.style.color =
                "#547044";


            message.textContent =
                "Welcome back!";


            setTimeout(
                () => {


                    window.location.href =
                        "index.html";

                },
                400
            );

        }
    );



/* =========================================================
   GUEST
========================================================= */

document
    .getElementById(
        "guestButton"
    )
    .addEventListener(
        "click",
        async () => {


            const button =
                document.getElementById(
                    "guestButton"
                );


            button.disabled =
                true;


            button.textContent =
                "Entering Nova...";


            try {


                const result =
                    await NovaAuth
                        .continueAsGuest();


                if (
                    result?.success ===
                    false
                ) {


                    button.disabled =
                        false;


                    button.textContent =
                        "Continue as Guest";


                    return;

                }


                window.location.href =
                    "index.html";


            }
            catch (
                error
            ) {


                console.error(
                    "Nova guest:",
                    error
                );


                button.disabled =
                    false;


                button.textContent =
                    "Continue as Guest";

            }

        }
    );


</script>


</body>

</html>
