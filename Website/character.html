<!-- =====================================================
     CHARACTER SCRIPT
===================================================== -->

<script type="module">


import {
    NovaCharacterViewer
}
from "./js/character-3d.js";


import {
    NOVA_ITEMS,
    NOVA_SKIN_TONES
}
from "./js/nova-items.js";



/* =========================================================
   USER
========================================================= */

const user =
    NovaAuth.getCurrentUser();


const saved =
    user?.character
    ||
    {};


/* =========================================================
   CURRENT CHARACTER
========================================================= */

let selectedHat =
    saved.hat
    ||
    "none";


let selectedFace =
    saved.face
    ||
    "happy";


let selectedShirt =
    saved.shirt
    ||
    "cafe";


let selectedPants =
    saved.pants
    ||
    "black";


let selectedSkin =
    saved.skin
    ||
    "yellow";



/* =========================================================
   USERNAME
========================================================= */

document.getElementById(
    "characterUsername"
).textContent =
    user?.username
    ||
    "Guest";



/* =========================================================
   VIEWER
========================================================= */

const viewer =
    new NovaCharacterViewer(
        document.getElementById(
            "characterViewer"
        )
    );


const status =
    document.getElementById(
        "viewerStatus"
    );



/* =========================================================
   SAFE LOAD
========================================================= */

async function safeLoad(
    message,
    action
) {

    try {

        status.textContent =
            message;


        await action();


        return true;

    }
    catch (error) {

        console.warn(
            `Nova: ${message} failed.`,
            error
        );


        return false;

    }

}



/* =========================================================
   START CHARACTER
========================================================= */

async function startViewer() {


    try {

        status.textContent =
            "Loading body...";


        await viewer.loadBody();

    }
    catch (error) {

        console.error(
            "Nova: character body failed.",
            error
        );


        status.textContent =
            "Character failed";


        return;

    }



    /* SKIN */

    try {

        viewer.setSkinTone(
            NOVA_SKIN_TONES[
                selectedSkin
            ].color
        );

    }
    catch (error) {

        console.warn(
            "Nova: skin failed.",
            error
        );

    }



    /* FACE */

    await safeLoad(
        "Loading face...",

        async () => {

            await viewer.setFace(
                selectedFace
            );

        }
    );



    /* SHIRT */

    await safeLoad(
        "Loading shirt...",

        async () => {

            await viewer.setShirt(
                selectedShirt
            );

        }
    );



    /* PANTS */

    await safeLoad(
        "Loading pants...",

        async () => {

            await viewer.setPants(
                selectedPants
            );

        }
    );



    /* HAT */

    await safeLoad(
        "Loading hat...",

        async () => {

            await viewer.setHat(
                selectedHat
            );

        }
    );


    updateUI();


    status.textContent =
        "Ready";

}



/* =========================================================
   HAT BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-hat]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                async () => {

                    selectedHat =
                        button.dataset.hat;


                    await safeLoad(
                        "Changing hat...",

                        async () => {

                            await viewer.setHat(
                                selectedHat
                            );

                        }
                    );


                    updateUI();


                    status.textContent =
                        "Ready";

                }
            );

        }
    );



/* =========================================================
   FACE BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-face]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                async () => {

                    selectedFace =
                        button.dataset.face;


                    await safeLoad(
                        "Changing face...",

                        async () => {

                            await viewer.setFace(
                                selectedFace
                            );

                        }
                    );


                    updateUI();


                    status.textContent =
                        "Ready";

                }
            );

        }
    );



/* =========================================================
   SHIRT BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-shirt]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                async () => {

                    selectedShirt =
                        button.dataset.shirt;


                    await safeLoad(
                        "Changing shirt...",

                        async () => {

                            await viewer.setShirt(
                                selectedShirt
                            );

                        }
                    );


                    updateUI();


                    status.textContent =
                        "Ready";

                }
            );

        }
    );



/* =========================================================
   PANTS BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-pants]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                async () => {

                    selectedPants =
                        button.dataset.pants;


                    await safeLoad(
                        "Changing pants...",

                        async () => {

                            await viewer.setPants(
                                selectedPants
                            );

                        }
                    );


                    updateUI();


                    status.textContent =
                        "Ready";

                }
            );

        }
    );



/* =========================================================
   SKIN BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-skin]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                () => {

                    selectedSkin =
                        button.dataset.skin;


                    viewer.setSkinTone(
                        NOVA_SKIN_TONES[
                            selectedSkin
                        ].color
                    );


                    updateUI();

                }
            );

        }
    );



/* =========================================================
   UPDATE SELECTED UI
========================================================= */

function updateUI() {


    document
        .querySelectorAll(
            "[data-hat]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "selected",

                    button.dataset.hat ===
                    selectedHat

                );

            }
        );


    document
        .querySelectorAll(
            "[data-face]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "selected",

                    button.dataset.face ===
                    selectedFace

                );

            }
        );


    document
        .querySelectorAll(
            "[data-shirt]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "selected",

                    button.dataset.shirt ===
                    selectedShirt

                );

            }
        );


    document
        .querySelectorAll(
            "[data-pants]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "selected",

                    button.dataset.pants ===
                    selectedPants

                );

            }
        );


    document
        .querySelectorAll(
            "[data-skin]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "selected",

                    button.dataset.skin ===
                    selectedSkin

                );

            }
        );



    document.getElementById(
        "currentHatName"
    ).textContent =

        selectedHat === "none"

            ? "None"

            : (
                NOVA_ITEMS
                    .hats[
                        selectedHat
                    ]
                    ?.name

                ||

                selectedHat
            );



    document.getElementById(
        "currentFaceName"
    ).textContent =

        NOVA_ITEMS
            .faces[
                selectedFace
            ]
            ?.name

        ||

        selectedFace;



    document.getElementById(
        "currentShirtName"
    ).textContent =

        NOVA_ITEMS
            .shirts[
                selectedShirt
            ]
            ?.name

        ||

        selectedShirt;



    document.getElementById(
        "currentPantsName"
    ).textContent =

        NOVA_ITEMS
            .pants[
                selectedPants
            ]
            ?.name

        ||

        selectedPants;



    document.getElementById(
        "currentSkinName"
    ).textContent =

        NOVA_SKIN_TONES[
            selectedSkin
        ]
            ?.name

        ||

        selectedSkin;

}



/* =========================================================
   SAVE CHARACTER + AVATAR IMAGE
========================================================= */

document.getElementById(
    "saveCharacterButton"
).addEventListener(

    "click",

    () => {


        const message =
            document.getElementById(
                "saveCharacterMessage"
            );


        const currentUser =
            NovaAuth.getCurrentUser();


        if (!currentUser) {

            window.location.href =
                "login.html";

            return;

        }


        /* ===============================================
           CHARACTER DATA
        ================================================ */

        const characterData = {

            body:
                "r6",

            hat:
                selectedHat,

            face:
                selectedFace,

            shirt:
                selectedShirt,

            pants:
                selectedPants,

            skin:
                selectedSkin

        };


        /* ===============================================
           CREATE 2D RENDERED IMAGE
        ================================================ */

        let avatarImage =
            null;


        try {

            avatarImage =
                viewer.getAvatarImage();


            console.log(
                "Nova: generated avatar PNG."
            );

        }
        catch (error) {

            console.error(
                "Nova: avatar image generation failed.",
                error
            );

        }


        /* ===============================================
           SAVE BOTH
        ================================================ */

        const success =
            NovaAuth.updateCurrentUser({

                character:
                    characterData,

                avatarImage:
                    avatarImage

            });


        if (!success) {

            message.textContent =
                "Could not save character.";

            return;

        }


        console.log(
            "Nova: saved character:",
            characterData
        );


        console.log(
            "Nova: avatar image saved:",
            !!avatarImage
        );


        message.textContent =
            "Character saved! ☕";


        setTimeout(
            () => {

                message.textContent =
                    "";

            },
            2000
        );

    }

);



/* =========================================================
   START
========================================================= */

startViewer();


</script>
